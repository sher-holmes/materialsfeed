name: Update materials feed

on:
  schedule:
    # 每天 UTC 00:00 執行 = 台灣時間早上 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest articles
        run: python scripts/fetch_feeds.py

      - name: Commit and push if changed
        run: |
          git config user.name "materials-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || git commit -m "chore: update feed data"
          git push

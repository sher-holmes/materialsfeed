
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料前線 · 期刊即時動態</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D0C;
    --bg-raised: #101312;
    --hairline: rgba(233, 230, 223, 0.10);
    --text: #E9E6DF;
    --text-dim: #8B9490;
    --accent: #5E9C8C;      /* 氧化銅綠 — 呼應金屬表面塗層/鏽化主題 */
    --accent-warm: #C99A5B; /* 熱處理琥珀色 — 呼應散熱/熱噴塗主題 */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .shell {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  header.top {
    position: sticky;
    top: 0;
    background: rgba(11, 13, 12, 0.92);
    backdrop-filter: blur(8px);
    padding: 22px 0 14px;
    border-bottom: 1px solid var(--hairline);
    z-index: 10;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    font-family: "Source Serif 4", "Noto Serif TC", serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .updated {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .search {
    margin-top: 16px;
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
  }
  .search::placeholder { color: var(--text-dim); }
  .search:focus { outline: none; border-color: var(--accent); }

  .chips {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip[data-active="true"] {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  main { padding-top: 6px; }

  .day-label {
    font-size: 12px;
    color: var(--text-dim);
    padding: 22px 0 8px;
    letter-spacing: 0.02em;
  }
  .day-label:first-child { padding-top: 18px; }

  article.item {
    padding: 16px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .tag {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }
  .tag-coating { background: var(--accent); }
  .tag-insulation { background: #7C9CBF; }
  .tag-thermal { background: var(--accent-warm); }
  .tag-general { background: #8B9490; }

  .item h2 {
    font-family: "Source Serif 4", "Noto Serif TC", serif;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.45;
    margin: 0 0 4px;
  }
  .item h2 a { text-decoration: none; }
  .item h2 a:hover { color: var(--accent); }

  .item p.original-title {
    font-family: "IBM Plex Sans", "Noto Sans TC", sans-serif;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 8px;
    opacity: 0.85;
  }

  .item p.summary {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-dim);
    margin: 0;
  }

  .item img.thumb {
    display: block;
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 10px;
    background: var(--bg-raised);
  }

  .empty, .loading {
    padding: 60px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.8;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding-top: 30px;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="title-row">
        <h1>材料前線</h1>
        <span class="updated" id="updated">載入中…</span>
      </div>
      <input class="search" id="search" type="text" placeholder="搜尋標題關鍵字…">
      <div class="chips" id="chips">
        <button class="chip" data-cat="all" data-active="true">全部</button>
        <button class="chip" data-cat="coating">表面塗層</button>
        <button class="chip" data-cat="insulation">絕緣</button>
        <button class="chip" data-cat="thermal">散熱</button>
        <button class="chip" data-cat="general">綜合材料</button>
      </div>
    </header>

    <main id="feed">
      <div class="loading">載入期刊資料中…</div>
    </main>

    <footer>
      來源為各期刊官方 RSS，資料每日自動更新一次。<br>
      原始資料：<a href="./data/feed.json" target="_blank">data/feed.json</a>
    </footer>
  </div>

<script>
const CATEGORY_LABEL = { coating: "表面塗層", insulation: "絕緣", thermal: "散熱", general: "綜合材料" };

let allItems = [];
let activeCategory = "all";
let searchTerm = "";

function relativeDay(iso) {
  if (!iso) return "日期不明";
  const d = new Date(iso);
  const now = new Date();
  const diffDays = Math.floor((now - d) / 86400000);
  if (diffDays <= 0) return "今天";
  if (diffDays === 1) return "昨天";
  if (diffDays < 7) return `${diffDays} 天前`;
  return d.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric" });
}

function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("zh-TW", { month: "short", day: "numeric" });
}

function render() {
  const feedEl = document.getElementById("feed");
  const filtered = allItems.filter(it => {
    const catOk = activeCategory === "all" || it.category === activeCategory;
    const haystack = `${it.title} ${it.title_zh || ""} ${it.summary || ""}`.toLowerCase();
    const searchOk = !searchTerm || haystack.includes(searchTerm);
    return catOk && searchOk;
  });

  if (filtered.length === 0) {
    feedEl.innerHTML = `<div class="empty">目前沒有符合的文章。<br>若你剛設定好這個網站，代表 GitHub Action 還沒執行過第一次抓取。</div>`;
    return;
  }

  let html = "";
  let lastDayLabel = null;
  for (const it of filtered) {
    const dayLabel = relativeDay(it.published);
    if (dayLabel !== lastDayLabel) {
      html += `<div class="day-label">${dayLabel}</div>`;
      lastDayLabel = dayLabel;
    }
    const displayTitle = it.title_zh || it.title;
    const showOriginal = it.title_zh && it.title_zh !== it.title;
    html += `
      <article class="item">
        <div class="item-meta">
          <span class="tag tag-${it.category}"></span>
          <span>${it.source}</span>
          <span>·</span>
          <span>${shortDate(it.published)}</span>
        </div>
        <h2><a href="${it.link}" target="_blank" rel="noopener">${displayTitle}</a></h2>
        ${showOriginal ? `<p class="original-title">${it.title}</p>` : ""}
        ${it.summary ? `<p class="summary">${it.summary}</p>` : ""}
        ${it.image ? `<a href="${it.link}" target="_blank" rel="noopener"><img class="thumb" src="${it.image}" alt="" loading="lazy" onerror="this.remove()"></a>` : ""}
      </article>
    `;
  }
  feedEl.innerHTML = html;
}

function setUpdatedLabel(iso, sourcesOk, sourcesFailed) {
  const el = document.getElementById("updated");
  if (!iso) {
    el.textContent = "尚未更新";
    return;
  }
  const d = new Date(iso);
  const label = d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  el.textContent = `更新於 ${label}`;
  el.title = `${sourcesOk} 個來源成功、${sourcesFailed} 個失敗`;
}

async function init() {
  try {
    const res = await fetch("./data/feed.json", { cache: "no-store" });
    const data = await res.json();
    allItems = data.items || [];
    setUpdatedLabel(data.updated_at, data.sources_ok, data.sources_failed);
  } catch (e) {
    document.getElementById("updated").textContent = "讀取失敗";
  }
  render();

  document.getElementById("chips").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    document.querySelectorAll(".chip").forEach(c => c.removeAttribute("data-active"));
    btn.setAttribute("data-active", "true");
    activeCategory = btn.dataset.cat;
    render();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });
}

init();
</script>
</body>
</html>
